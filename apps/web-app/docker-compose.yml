services:
  redis:
    image: redis:7-alpine
    container_name: web-app-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web-app-network

volumes:
  redis_data:

networks:
  web-app-network:
    driver: bridge

